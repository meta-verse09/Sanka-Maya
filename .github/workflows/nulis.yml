
name: Sanka Maya AI Writer
on:
  workflow_dispatch:
    inputs:
      judul:
        description: 'Judul artikel yang mau dibikin'
        required: true
        default: 'Arti Angka Kembar 22:22 Menurut Numerologi'
jobs:
  nulis:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: pip install requests
      - name: Tulis Artikel
        run: python bot.py "${{ inputs.judul }}"
      - name: Commit
        run: |
          git config user.name "sanka-bot"
          git config user.email "bot@sanka-maya.com"
          git add artikel/
          git diff --staged --quiet || git commit -m "artikel ${{ inputs.judul }}"
          git push
